# Configure which test environments are run for each Github Actions Python version.
[gh-actions]
python =
    3.11: py311-django52, type-check, lint
    3.12: py312-django{52,60,61}
    3.13: py313-django{52,60,61}
    3.14: py314-django{52,60,61}
    3.15: py315-django61

[tox]
envlist =
    type-check
    lint
    py311-django52
    py{312,313,314}-django{52,60,61}
    py315-django61

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1.3,<6.2
commands =
    {envpython} {toxinidir}/manage.py test solo --settings=solo.tests.settings

[testenv:build]
skip_install = true
deps =
    build
commands =
    {envpython} -m build

[testenv:upload]
skip_install = true
deps =
    twine
commands =
    {envpython} -m twine upload {toxinidir}/dist/*

[testenv:type-check]
skip_install = true
deps =
    mypy==2.4.1
    django-stubs==6.1.2
commands =
    mypy solo

[testenv:lint]
skip_install = true
deps =
    ruff==0.17.3
commands =
    ruff format --check
    ruff check
